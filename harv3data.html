<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Gist XML Harvester & Editor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background: #fafafa; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 60px; resize: vertical; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 14px; color: #333; }
        button { color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-fetch { background: #28a745; margin-bottom: 20px; }
        .btn-generate { background: #0266d6; width: 100%; margin-top: 15px; }
        pre { background: #222; color: #fff; padding: 15px; border-radius: 4px; overflow-x: auto; margin-top: 20px; }
        .section { background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 20px; }
        .hidden { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        h2 { border-bottom: 2px solid #0266d6; padding-bottom: 5px; color: #0266d6; }
        h3 { margin-top: 0; color: #555; }
    </style>
</head>
<body>

    <h1>Harvest & Edit Gist XML Record</h1>
    
    <!-- TRINN 1: HENT DATA -->
    <div class="section">
        <label for="targetUrl">GitHub Gist XML URL:</label>
        <input type="text" id="targetUrl" value="PASTE_YOUR_RAW_GITHUB_GIST_URL_HERE">
        <button class="btn-fetch" onclick="fetchGistData()">Fetch & Populate Fields</button>
        <span id="status"></span>
    </div>

    <!-- TRINN 2: REDIGERINGSFORM (Skjult til data er hentet) -->
    <div id="editorSection" class="section hidden">
        <h2>Edit Metadata Before Export</h2>
        
        <div class="grid">
            <div>
                <label for="repoIdentifier">Identifier:</label>
                <input type="text" id="repoIdentifier">
            </div>
            <div>
                <label for="repoName">Repository Name:</label>
                <input type="text" id="repoName">
            </div>
        </div>

        <label for="repoUrl">Repository URL:</label>
        <input type="text" id="repoUrl">

        <label for="description">Description:</label>
        <textarea id="description"></textarea>

        <div class="grid">
            <div>
                <label for="startDate">Date Created:</label>
                <input type="text" id="startDate">
            </div>
            <div>
                <label for="repoLanguage">Languages (comma separated):</label>
                <input type="text" id="repoLanguage">
            </div>
        </div>

        <h3>Provider / Institution</h3>
        <div class="grid">
            <div>
                <label for="instName">Institution Name:</label>
                <input type="text" id="instName">
            </div>
            <div>
                <label for="instCountry">Institution Country:</label>
                <input type="text" id="instCountry">
            </div>
        </div>

        <h3>Custom Metadata & Extensions</h3>
        <div class="grid">
            <div>
                <label for="contentType">Content Type (comma separated):</label>
                <input type="text" id="contentType">
            </div>
            <div>
                <label for="pidSystem">PID System (comma separated):</label>
                <input type="text" id="pidSystem">
            </div>
        </div>

        <label for="funderName">Funding Source Profile:</label>
        <input type="text" id="funderName">

        <h3>Supplementary Information</h3>
        <label for="suppKeywords">Keywords (comma separated):</label>
        <input type="text" id="suppKeywords" placeholder="e.g. climate change, open science">

        <label for="suppComment">Additional Comments:</label>
        <textarea id="suppComment" placeholder="Add extra notes here..."></textarea>

        <button class="btn-generate" onclick="generateJsonLD()">Generate & Inject JSON-LD</button>
    </div>

    <!-- TRINN 3: OUTPUT -->
    <pre><code id="output">// JSON-LD will print here after clicking "Generate"...</code></pre>

    <script>
        // Global variabel for å sjekke om vi har et aktivt funder-element fra XML
        let hasFunder = false;

        async function fetchGistData() {
            const url = document.getElementById('targetUrl').value.trim();
            const status = document.getElementById('status');
            const editorSection = document.getElementById('editorSection');
            
            status.textContent = " Fetching and parsing XML...";
            status.style.color = "orange";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "application/xml");
                if (xmlDoc.querySelector("parsererror")) throw new Error("Invalid XML structure.");

                // Helper-funksjoner for XML-parsing
                const txt = (sel) => xmlDoc.querySelector(sel)?.textContent?.trim() || "";
                const list = (sel) => Array.from(xmlDoc.querySelectorAll(sel)).map(el => el.textContent.trim()).filter(Boolean).join(", ");

                // Populerer alle redigerbare input-felter med data fra XML
                document.getElementById('repoIdentifier').value = txt("repositoryIdentifier");
                document.getElementById('repoName').value = txt("repositoryName");
                document.getElementById('repoUrl').value = txt("repositoryURL");
                document.getElementById('description').value = txt("description");
                document.getElementById('startDate').value = txt("startDate");
                document.getElementById('repoLanguage').value = list("repositoryLanguage");
                document.getElementById('instName').value = txt("institutionName");
                document.getElementById('instCountry').value = txt("institutionCountry");
                
                document.getElementById('contentType').value = list("contentType");
                document.getElementById('pidSystem').value = list("pidSystem");
                
                const funderEl = xmlDoc.querySelector("fundingInformation funderName");
                document.getElementById('funderName').value = funderEl ? funderEl.textContent.trim() : "";
                hasFunder = !!funderEl;

                // Vis redigeringsskjemaet
                editorSection.classList.remove('hidden');
                status.textContent = " Data loaded! You can now edit the fields below.";
                status.style.color = "green";

            } catch (err) {
                status.textContent = ` Error: ${err.message}`;
                status.style.color = "red";
                editorSection.classList.add('hidden');
            }
        }

        function generateJsonLD() {
            const output = document.getElementById('output');

            // Hjelpefunksjon for å gjøre komma-separerte strenger om til rene arrays
            const cleanList = (id) => document.getElementById(id).value.split(',').map(v => v.trim()).filter(Boolean);
            const cleanTxt = (id) => document.getElementById(id).value.trim() || null;

            // Bygg opp JSON-LD objektet basert på de REDIGERTE verdiene i skjemaet
            const jsonLD = {
                "@context": "https://schema.org",
                "@type": "DataRepository",
                "identifier": cleanTxt("repoIdentifier"),
                "name": cleanTxt("repoName"),
                "url": cleanTxt("repoUrl"),
                "description": cleanTxt("description"),
                "dateCreated": cleanTxt("startDate"),
                "offersLanguage": cleanList("repoLanguage"),
                "provider": {
                    "@type": "Organization",
                    "name": cleanTxt("instName"),
                    "location": cleanTxt("instCountry")
                },
                "value": []
            };

            // Legg til Keywords hvis utfylt
            const keywords = cleanList("suppKeywords");
            if (keywords.length > 0) {
                jsonLD.keywords = keywords;
            }

            // Legg til Comment hvis utfylt
            const comment = cleanTxt("suppComment");
            if (comment) {
                jsonLD.comment = {
                    "@type": "Comment",
                    "text": comment
                };
            }

            // Generer PropertyValue-objekter fra de redigerte listene
            cleanList("contentType").forEach(val => jsonLD.value.push({ "@type": "PropertyValue", "name": "Content Type", "value": val }));
            cleanList("pidSystem").forEach(val => jsonLD.value.push({ "@type": "PropertyValue", "name": "PID System", "value": val }));

            // Legg til funder hvis feltet inneholder tekst
            const funderText = cleanTxt("funderName");
            if (funderText) {
                jsonLD.value.push({ "@type": "PropertyValue", "name": "Funding Source Profile", "value": funderText });
            }

            // Injisering til DOM <head>
            const oldScript = document.getElementById('gist-jsonld');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'gist-jsonld';
            script.type = 'application/ld+json';
            script.text = JSON.stringify(jsonLD, null, 2);
            document.head.appendChild(script);

            // Vis resultatet i kodeblokken
            output.textContent = script.text;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>re3data Harvester v3</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --border: #dfe7f2;
      --primary: #0d6efd;
      --primary-dark: #0b5ed7;
      --success: #198754;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #dc3545;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 40px auto;
      max-width: 980px;
      padding: 0 20px 40px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      margin: 0;
    }

    .input-group {
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    button:disabled {
      background: #c8d2df;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: #6c757d;
    }

    .secondary-btn:hover:not(:disabled) {
      background: #545b62;
    }

    .download-btn {
      background: var(--success);
    }

    .download-btn:hover:not(:disabled) {
      background: #157347;
    }

    #status {
      margin-top: 18px;
      min-height: 24px;
      font-weight: 700;
      color: var(--muted);
    }

    .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    h3 {
      margin-top: 28px;
      margin-bottom: 10px;
    }

    pre {
      margin: 0;
      background: #f8fafc;
      color: #111827;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-height: 220px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    .error {
      color: var(--danger);
    }

    .ok {
      color: var(--success);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>re3data Harvester v3</h1>
    <p>Lim inn en re3data-URL eller ID, og få metadata konvertert til gyldig Turtle (.ttl).</p>

    <div class="input-group">
      <label for="repo-input"><strong>re3data URL eller ID:</strong></label>
      <input id="repo-input" type="text" placeholder="F.eks. https://www.re3data.org/repository/r3d100010134 eller bare r3d100010134" />
    </div>

    <div class="actions">
      <button id="start-btn" type="button">Konverter til Turtle</button>
      <button id="validate-btn" type="button" class="secondary-btn">Valider Turtle</button>
    </div>

    <div id="status">Klar.</div>
    <div class="note">Hvis nettleseren blokkerer CORS, kjør denne filen via en lokal webserver, f.eks.: python -m http.server 8000</div>

    <h3>Turtle-resultat (.ttl):</h3>
    <pre id="output">Resultatet vil dukke opp her...</pre>
  </div>

  <script>
    const API_URLS = [
      'https://www.re3data.org/api/beta/repository/',
      'https://re3data.org/api/beta/repository/'
    ];

    function cleanText(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/\\/g, '\\\\')
        .replace(/"/g, '\\"')
        .replace(/\r\n/g, ' ')
        .replace(/\n/g, ' ')
        .replace(/\r/g, ' ')
        .trim();
    }

    function escapeTurtleString(value) {
      return cleanText(value)
        .replace(/\t/g, '\\t')
        .replace(/\f/g, '\\f');
    }

    function extractRepoId(input) {
      const trimmed = (input || '').trim();
      if (!trimmed) return '';

      const directMatch = trimmed.match(/(?:^|\/)(r3d[0-9A-Za-z]+)(?:\/|\?|#|$)/i);
      if (directMatch && directMatch[1]) return directMatch[1];

      const candidate = trimmed
        .replace(/^https?:\/\//i, '')
        .replace(/^www\./i, '')
        .replace(/^re3data\.org\//i, '')
        .replace(/^\//, '')
        .replace(/\?.*$/, '')
        .replace(/#.*$/, '')
        .split('/')[0]
        .trim();

      return candidate || '';
    }

    function removeDownloadButton() {
      const existing = document.getElementById('download-btn');
      if (existing) existing.remove();
    }

    function createDownloadButton(content, repoId) {
      removeDownloadButton();

      const button = document.createElement('button');
      button.id = 'download-btn';
      button.type = 'button';
      button.className = 'download-btn';
      button.textContent = `Last ned ${repoId}.ttl`;

      button.addEventListener('click', () => {
        const blob = new Blob([content], { type: 'text/turtle;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `${repoId}.ttl`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('start-btn').insertAdjacentElement('afterend', button);
    }

    function getValueFromPath(obj, pathParts) {
      let current = obj;
      for (const part of pathParts) {
        if (current === null || current === undefined) return undefined;
        current = current[part];
      }
      return current;
    }

    function isPlainObject(value) {
      return value !== null && typeof value === 'object' && !Array.isArray(value);
    }

    function collectTextValues(value, results = []) {
      if (value === null || value === undefined) return results;

      if (Array.isArray(value)) {
        for (const item of value) collectTextValues(item, results);
        return results;
      }

      if (typeof value === 'object') {
        for (const [key, item] of Object.entries(value)) {
          const lowerKey = key.toLowerCase();
          if (
            lowerKey === 'label' ||
            lowerKey === 'name' ||
            lowerKey === 'title' ||
            lowerKey === 'text' ||
            lowerKey === 'value' ||
            lowerKey === 'term' ||
            lowerKey === 'keyword' ||
            lowerKey === 'subject' ||
            lowerKey === 'subjects'
          ) {
            const text = item && typeof item === 'object' && item.label ? item.label : item;
            if (typeof text === 'string' && text.trim()) results.push(text.trim());
          }
          collectTextValues(item, results);
        }
        return results;
      }

      if (typeof value === 'string' && value.trim()) {
        results.push(value.trim());
      }

      return results;
    }

    function findFirst(obj, keys) {
      if (!obj || typeof obj !== 'object') return undefined;

      const lowerKeys = keys.map(k => k.toLowerCase());

      if (Array.isArray(obj)) {
        for (const item of obj) {
          const found = findFirst(item, keys);
          if (found !== undefined) return found;
        }
        return undefined;
      }

      for (const [key, value] of Object.entries(obj)) {
        const lowerKey = key.toLowerCase();
        if (lowerKeys.includes(lowerKey)) {
          if (value !== undefined && value !== null && value !== '') return value;
        }

        const nested = findFirst(value, keys);
        if (nested !== undefined) return nested;
      }

      return undefined;
    }

    function normalizeRepositoryData(raw) {
      const candidate = raw?.repository || raw?.data || raw?.result || raw || {};
      if (!candidate || typeof candidate !== 'object') return null;

      const id =
        candidate.id ||
        candidate.repoId ||
        candidate.repositoryId ||
        candidate.repository_id ||
        candidate['@id'] ||
        '';

      const name =
        findFirst(candidate, ['repositoryName', 'name', 'title', 'repositoryTitle']) ||
        '';

      const url =
        findFirst(candidate, ['repositoryURL', 'repositoryUrl', 'url', 'website', 'homepage', 'landingPage']) ||
        '';

      const description =
        findFirst(candidate, ['description', 'repositoryDescription', 'summary', 'abstract']) ||
        '';

      let institutionValue = findFirst(candidate, ['institution', 'institutionName', 'organization', 'organisation', 'provider']);
      if (institutionValue && typeof institutionValue === 'object') {
        institutionValue = findFirst(institutionValue, ['name', 'title', 'label']);
      }

      let keywords = findFirst(candidate, ['keywords', 'tags', 'keyword', 'subjects']);
      if (!keywords) {
        keywords = findFirst(candidate, ['subject', 'subjects']);
      }
      const keywordList = collectTextValues(keywords).filter(Boolean);

      const subjectList = collectTextValues(findFirst(candidate, ['subject', 'subjects', 'subjectsList'])).filter(Boolean);

      return {
        id: String(id || '').trim(),
        name: String(name || '').trim(),
        url: String(url || '').trim(),
        description: String(description || '').trim(),
        institution: String(institutionValue || '').trim(),
        keywords: keywordList,
        subjects: subjectList
      };
    }

    function buildTurtle(repoId, metadata) {
      const subject = `r3d:${repoId}`;
      const lines = [
        '@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .',
        '@prefix dc: <http://purl.org/dc/terms/> .',
        '@prefix dcat: <http://www.w3.org/ns/dcat#> .',
        '@prefix foaf: <http://xmlns.com/foaf/0.1/> .',
        '@prefix schema: <https://schema.org/> .',
        '@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .',
        '@prefix r3d: <https://www.re3data.org/repository/> .',
        ''
      ];

      const properties = [
        '    rdf:type <https://www.re3data.org/ontology/Repository>'
      ];

      if (metadata.name) {
        properties.push(`    dc:title "${escapeTurtleString(metadata.name)}"^^xsd:string`);
      }

      if (metadata.url) {
        properties.push(`    dcat:landingPage <${metadata.url}>`);
        properties.push(`    schema:url <${metadata.url}>`);
      }

      if (metadata.description) {
        properties.push(`    dc:description "${escapeTurtleString(metadata.description)}"^^xsd:string`);
      }

      if (metadata.institution) {
        properties.push(`    dc:publisher "${escapeTurtleString(metadata.institution)}"^^xsd:string`);
      }

      const labels = [...(metadata.keywords || []), ...(metadata.subjects || [])].filter(Boolean);
      labels.forEach((label) => {
        properties.push(`    dc:subject "${escapeTurtleString(label)}"^^xsd:string`);
      });

      lines.push(subject);
      lines.push(properties.join(' ;\n') + ' .');
      return lines.join('\n');
    }

    function validateTurtle(turtle) {
      if (!turtle || typeof turtle !== 'string') {
        return { ok: false, message: 'Tom Turtle-streng.' };
      }

      const trimmed = turtle.trim();
      if (!trimmed.startsWith('@prefix') && !trimmed.startsWith('<')) {
        return { ok: false, message: 'Turtle-strengen ser ikke ut som gyldig RDF/Turtle.' };
      }

      const tripleCount = (trimmed.match(/\./g) || []).length;
      if (tripleCount < 1) {
        return { ok: false, message: 'Fant ingen RDF-trippel i Turtle-strengen.' };
      }

      const hasPrefix = /@prefix\s+[a-zA-Z0-9_-]+:\s*<[^>]+>\s*\./.test(trimmed);
      const hasSubject = /[A-Za-z0-9_:-]+\s*\n?\s*\w/.test(trimmed);
      if (!hasPrefix || !hasSubject) {
        return { ok: false, message: 'Turtle-strengen mangler nødvendige prefix eller subject-definisjon.' };
      }

      return { ok: true, message: 'Turtle-strengen ser gyldig ut.' };
    }

    async function fetchRepository(repoId) {
      let lastError = null;

      for (const baseUrl of API_URLS) {
        const url = `${baseUrl}${repoId}`;

        try {
          const response = await fetch(url, {
            method: 'GET',
            headers: {
              'Accept': 'application/json, text/plain, */*'
            }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = await response.text();
          if (!text || !text.trim()) {
            continue;
          }

          const parsed = JSON.parse(text);
          const normalized = normalizeRepositoryData(parsed);
          if (normalized && (normalized.name || normalized.url || normalized.description)) {
            return normalized;
          }
        } catch (error) {
          lastError = error;
        }
      }

      if (lastError) {
        throw new Error(`Kunne ikke hente gyldig metadata for ${repoId}. Sjekk ID-en. ${lastError.message}`);
      }

      throw new Error(`Kunne ikke hente data for ${repoId}. Sjekk at ID-en er riktig.`);
    }

    async function handleConvert() {
      const inputEl = document.getElementById('repo-input');
      const btn = document.getElementById('start-btn');
      const outputEl = document.getElementById('output');
      const statusEl = document.getElementById('status');

      removeDownloadButton();

      const rawInput = inputEl.value;
      if (!rawInput || !rawInput.trim()) {
        statusEl.textContent = 'Vennligst oppgi en URL eller ID først.';
        outputEl.textContent = 'Ingen input.';
        statusEl.className = 'error';
        return;
      }

      const repoId = extractRepoId(rawInput);
      if (!repoId) {
        statusEl.textContent = 'Kunne ikke finne en gyldig re3data-ID i inputen.';
        outputEl.textContent = 'Sjekk at du har limt inn en re3data-URL eller ID.';
        statusEl.className = 'error';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = `Henter metadata for ${repoId}...`;
      statusEl.className = '';
      outputEl.textContent = 'Jobber...';

      try {
        const metadata = await fetchRepository(repoId);
        const turtle = buildTurtle(repoId, metadata);
        outputEl.textContent = turtle;
        statusEl.textContent = 'Konvertering fullført!';
        statusEl.className = 'ok';
        createDownloadButton(turtle, repoId);
      } catch (error) {
        statusEl.textContent = 'Det oppstod en feil.';
        outputEl.textContent = error.message || 'Ukjent feil.';
        statusEl.className = 'error';
      } finally {
        btn.disabled = false;
      }
    }

    function handleValidate() {
      const outputEl = document.getElementById('output');
      const statusEl = document.getElementById('status');
      const turtle = outputEl.textContent.trim();

      if (!turtle || turtle === 'Resultatet vil dukke opp her...' || turtle === 'Jobber...' || turtle === 'Ingen input.') {
        statusEl.textContent = 'Ingen Turtle å validere ennå.';
        statusEl.className = 'error';
        return;
      }

      const validation = validateTurtle(turtle);
      if (validation.ok) {
        statusEl.textContent = validation.message;
        statusEl.className = 'ok';
      } else {
        statusEl.textContent = validation.message;
        statusEl.className = 'error';
      }
    }

    document.getElementById('start-btn').addEventListener('click', handleConvert);
    document.getElementById('validate-btn').addEventListener('click', handleValidate);
    document.getElementById('repo-input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        handleConvert();
      }
    });
  </script>
</body>
</html>

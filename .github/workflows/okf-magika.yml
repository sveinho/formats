name: OKF Magika Pipeline & GH Pages Deploy

on:
  push:
    paths:
      - 'raw/**'
      - 'wiki/**'
      - 'index.html'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-cache-dependency-path: '**/requirements.txt'
          python-version: '3.11'

      - name: Installer Google Magika
        run: |
          pip install --upgrade pip
          pip install magika

      - name: Kjør Magika Analyse
        run: python scripts/magika_runner.py

      - name: Commit OKF-oppdateringer (om noen)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wiki/
          if ! git diff --cached --quiet; then
            git commit -m "chore: automatisert OKF-attestering via Magika [skip ci]"
            git push origin main
          else
            echo "Ingen endringer i OKF-mappen."
          fi

      - name: Sett opp GitHub Pages
        uses: actions/configure-pages@v4

      - name: Last opp artefakt til Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
